name: Atualizar e publicar o portal
on:
  push:
    branches: [main]
    paths: ['relatorios/**', 'src/**', 'scripts/**', 'dados/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl xlrd
      - name: Extrair dados e montar o portal
        run: bash scripts/atualizar.sh
      - name: Guardar os dados atualizados no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dados/*.json
          git diff --cached --quiet || git commit -m "Atualiza dados e portal [automático]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
